[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "pysysinfo"
version = "0.0.1"
authors = [
  { name="quantumburrito", email="quantum_burrito_dev@pm.me" },
]
description = "A small cli tool which displays system information. written in python for linux / macos :D"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: Unix",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/quantumburrito/pysysinfo"
Issues = "https://github.com/quantumburrito/pysysinfo"